name: "Bruno Cerda Mardini"
summary: "Master's student at PUC focused on world models and reinforcement learning."
bio: |
  I'm currently in my third semester as a master's student at PUC (Pontifical Catholic University of Chile), advised by [Professor Hans Lobel](https://scholar.google.com/citations?user=oKYALakAAAAJ&hl=en). Before beginning my master's degree, I earned a bachelor's degree in Engineering with a major in Data Science at PUC. My master's research focuses on world models, particularly those that enable reinforcement learning agents to learn viable policies across diverse environments. On this blog, I'll share preprints, papers as they are (hopefully) published, and shorter technical write-ups presenting interesting conclusions from experiments with world models that I conduct as part of my research.
