  - blog/technical-write-up-1/tw2-latex.log
  - blog/technical-write-up-1/references.bib
  - blog/technical-write-up-1/rewards_per_game_latent_comparison.pdf
  - blog/technical-write-up-1/diagrams/*.tex
  - blog/technical-write-up-1/diagrams/*.pdf
